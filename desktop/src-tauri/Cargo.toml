[package]
name = "free-model-router-desktop"
version = "0.8.4"
description = "Free-Model-Router desktop shell"
authors = ["Free-Model-Router contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
default-run = "free-model-router-desktop"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.3.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

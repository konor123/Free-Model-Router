name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test ./... -race -coverprofile=coverage.txt -covermode=atomic

      - name: go vet
        run: go vet ./...

      - name: go build
        run: |
          go build ./...
          go build ./cmd/fmr
          go build ./cmd/fmr-package

      - name: packaging contract tests
        run: go test ./internal/packaging/... ./cmd/fmr-package/...
